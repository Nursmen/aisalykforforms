<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Журнал электронных отчётов</title><link rel="stylesheet" href="journal.css"></head><body><main class="journal"><header><h1>Журнал электронных отчётов</h1><div class="toolbar"><button class="blue" id="instructions">Порядок заполнения форм отчётов</button><button id="filterToggle" aria-expanded="false">Фильтр</button></div></header><form class="filters" id="filters" hidden><label>Статус<select id="statusFilter"><option value="">Все статусы</option><option>Ожидает отправки</option><option>Принят</option><option>В обработке</option></select></label><label>Код формы<input id="codeFilter" placeholder="Например, 091"></label><button type="reset">Сбросить</button></form><div id="notice" role="status"></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Статус</th><th>Район</th><th>Код</th><th>Период</th><th>Тип</th><th>Сформирован<br>автоматически</th><th>Дата<br>заполнения</th><th>Дата<br>отправки</th><th>Дата<br>принятия</th><th></th><th></th></tr></thead><tbody id="reports"></tbody></table></div><footer><a href="index.html">Вернуться к диалогу</a><span>Демонстрационный журнал · без отправки в ГНС</span></footer></main><dialog id="info"><h2 id="infoTitle"></h2><p id="infoText"></p><div class="dialog-actions"><button id="cancelInfo">Закрыть</button><button class="blue" id="confirmSend" hidden>Имитировать отправку</button></div></dialog><script src="journal.js"></script></body></html>
