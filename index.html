<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АйСалык — заполнение отчётов</title><meta name="description" content="Интерактивный макет заполнения налоговой отчётности в чате АйСалык."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%233a8bfa'/%3E%3Cpath d='M10 29 20 10 30 29M14 23h12' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar">
<a class="brand" href="./"><span class="brand-mark">A</span>АйСалык</a>
<button class="new-chat" id="newChat"><span>＋</span> Новый чат</button>
<button id="modeButton" class="mode-button" aria-pressed="false"><span>▤</span> Заполнение отчётов <span class="toggle"><i></i></span></button>
<div class="history-head">История</div>
<button class="history" id="demoHistory">Единый налог</button>
</aside>
<main><header class="topbar"><div class="chat-title"><img class="assistant-avatar mascot" src="assets/squirrel-laptop.png" alt=""><span id="chatTitle">Суперчат</span></div></header>
<div class="workspace"><section class="chat-column"><div class="conversation" id="conversation" aria-live="polite"></div>
<div class="composer-area"><form id="messageForm" class="composer"><input id="messageInput" autocomplete="off" aria-label="Сообщение" placeholder="Напишите что-нибудь…"><button class="send" type="submit" aria-label="Отправить сообщение">➤</button></form><div class="composer-footer">Макет: любой текст продолжает сценарий</div></div></section></div></main>
<dialog id="pdfDialog"><div class="pdf-toolbar"><div><b>Отчёт по Единому налогу</b><small>Первоначальный · I квартал 2026</small></div><button id="closePdf" class="close-button" aria-label="Закрыть предпросмотр">×</button></div><iframe id="reportFrame" title="Заполненная форма отчёта по Единому налогу" src="about:blank"></iframe></dialog>
<script src="app.js"></script></body></html>
